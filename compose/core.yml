services:
  portainer:
    image: portainer/portainer-ce
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: always
    environment:
      TZ: ${TZ}
      WEBPASSWORD: ${PIHOLE_WEBPASSWORD}
    ports:
      - "8081:80"
      - "53:53/tcp"
      - "53:53/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/admin/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    volumes:
      - pihole_data:/etc/pihole

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    restart: always
    ports:
      - "8080:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/rootfs:ro
      - dashboard_data:/data

volumes:
  portainer_data:
  pihole_data:
  dashboard_data:
